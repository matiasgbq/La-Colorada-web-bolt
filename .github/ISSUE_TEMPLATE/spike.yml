name: Spike
description: Investigación acotada para reducir incertidumbre
title: "SPIKE-__: "
labels:
  - "type: spike"
body:
  - type: textarea
    id: question
    attributes:
      label: Pregunta o incertidumbre
    validations:
      required: true
  - type: textarea
    id: research
    attributes:
      label: Alcance de la investigación
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Timebox
      placeholder: Una sesión enfocada
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Evidencia y decisión esperada
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Fuera de alcance

