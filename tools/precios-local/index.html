<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Precios del local | La Colorada</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/prices.js?v=c966d05" defer></script>
</head>
<body>
  <main>
    <header><p class="brand">LA COLORADA</p><h1>Precios del local</h1>
    <p><strong>Hola Luciano, bienvenido a la página interna de La Colorada.</strong></p>
    <p>Los mismos precios que figuran en la carta web.</p></header>
    <div class="lookup" id="lookup">
      <div class="controls">
        <label for="search">Buscar plato o código</label>
        <input id="search" type="search" placeholder="Ej. muzzarella o PIZ001">
        <button id="refresh" type="button">Actualizar precios</button>
      </div>
      <nav id="categories" aria-label="Filtrar por categoría" hidden></nav>
      <a class="order-jump" href="#counter-order">Ver pedido <span id="order-count">· 0</span></a>
    </div>
    <p id="status" role="status">Cargando precios…</p>
    <div class="counter-layout">
      <div id="catalog"></div>
      <aside id="counter-order" class="order" aria-labelledby="order-title">
        <h2 id="order-title">Pedido de mostrador</h2>
        <div id="half-pizza" class="half-pizza" hidden>
          <details>
            <summary>Pizza mitad y mitad</summary>
            <div class="half-pizza-fields">
          <label for="pizza-first">Primera mitad</label>
          <select id="pizza-first"></select>
          <label for="pizza-second">Segunda mitad</label>
          <select id="pizza-second"></select>
          <p id="half-pizza-price" aria-live="polite"></p>
          <button id="add-half-pizza" type="button">Agregar pizza mitad y mitad</button>
            </div>
          </details>
        </div>
        <p id="order-empty">Tocá Agregar al lado de un plato.</p>
        <ul id="order-items" aria-label="Platos del pedido"></ul>
        <div class="order-footer">
          <span>Total</span>
          <output id="order-total" aria-live="polite">$0</output>
        </div>
        <button id="clear-order" type="button" disabled>Vaciar pedido</button>
        <a class="order-jump" href="#lookup">Volver a los platos</a>
      </aside>
    </div>
  </main>
</body>
</html>
