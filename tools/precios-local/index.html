<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Precios del local | La Colorada</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/prices.js" defer></script>
</head>
<body>
  <main>
    <header><p class="brand">LA COLORADA</p><h1>Precios del local</h1>
    <p>Los mismos precios que figuran en la carta web.</p></header>
    <div class="controls">
      <label for="search">Buscar plato o código</label>
      <input id="search" type="search" placeholder="Ej. muzzarella o PIZ001">
      <button id="refresh" type="button">Actualizar precios</button>
      <p id="status" role="status">Cargando precios…</p>
    </div>
    <div id="catalog"></div>
  </main>
</body>
</html>
