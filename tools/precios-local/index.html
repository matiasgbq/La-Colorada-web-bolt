<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Precios del local | La Colorada</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/prices.js" defer></script>
</head>
<body>
  <main>
    <header><p class="brand">LA COLORADA</p><h1>Precios del local</h1>
    <p>Los mismos precios que figuran en la carta web.</p></header>

    <section class="active-orders" aria-labelledby="active-orders-title">
      <h2 id="active-orders-title">Pedidos en curso <span id="active-orders-count">· …</span></h2>
      <p id="active-orders-status" class="active-orders-status">Cargando pedidos…</p>
      <div id="active-orders-list" class="active-order-grid"></div>
    </section>

    <div class="lookup" id="lookup">
      <div class="controls">
        <label for="search">Buscar plato o código</label>
        <input id="search" type="search" placeholder="Ej. muzzarella o PIZ001">
        <button id="refresh" type="button">Actualizar precios</button>
      </div>
      <nav id="categories" aria-label="Filtrar por categoría" hidden></nav>
      <a class="order-jump" href="#counter-order">Ver pedido <span id="order-count">· 0</span></a>
    </div>
    <p id="status" role="status">Cargando precios…</p>
    <div class="counter-layout">
      <div id="catalog"></div>
      <aside id="counter-order" class="order" aria-labelledby="order-title">
        <h2 id="order-title">Pedido de mostrador</h2>
        <div id="half-pizza" class="half-pizza" hidden>
          <details>
            <summary>Pizza mitad y mitad</summary>
            <div class="half-pizza-fields">
          <label for="pizza-first">Primera mitad</label>
          <select id="pizza-first"></select>
          <label for="pizza-second">Segunda mitad</label>
          <select id="pizza-second"></select>
          <p id="half-pizza-price" aria-live="polite"></p>
          <button id="add-half-pizza" type="button">Agregar pizza mitad y mitad</button>
            </div>
          </details>
        </div>
        <div class="order-customer">
          <label for="order-customer">Cliente / referencia</label>
          <input id="order-customer" placeholder="Ej. Juan">
          <label for="order-address">Dirección</label>
          <input id="order-address" placeholder="Ej. San Martín 875, lote 9">
          <label for="order-time">Horario / salida</label>
          <input id="order-time" placeholder="Ej. 21:00 o apenas esté">
          <label for="order-payment">Pago</label>
          <select id="order-payment"><option value="">Sin definir</option><option>Efectivo</option><option>Transferencia</option><option>Mercado Pago</option><option>Tarjeta</option></select>
          <label for="order-notes">Notas</label>
          <input id="order-notes" placeholder="Aclaraciones del pedido">
        </div>
        <p id="order-empty">Tocá Agregar al lado de un plato.</p>
        <ul id="order-items" aria-label="Platos del pedido"></ul>
        <div class="order-footer">
          <span>Total</span>
          <output id="order-total" aria-live="polite">$0</output>
        </div>
        <button id="save-order" type="button" disabled>Crear pedido</button>
        <p id="save-order-status" class="save-order-status" role="status"></p>
        <button id="clear-order" type="button" disabled>Vaciar pedido</button>
        <a class="order-jump" href="#lookup">Volver a los platos</a>
      </aside>
    </div>
  </main>
</body>
</html>
